name: PR Checks

on:
  pull_request:
    branches: [main]
    # Deliberately no paths-ignore. Branch protection requires the 'lint' and 'test'
    # contexts, and a workflow skipped by paths-ignore reports no status at all --
    # which makes a docs-only PR permanently unmergeable ("no checks reported").
    # These jobs take ~20s, so always running them is cheaper than the dead end.
    # deploy.yml keeps its paths-ignore, since docs changes need no deployment.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check source/ scripts/

      - name: Format check (ruff)
        run: uv run ruff format --check source/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/ -v --ignore=tests/test_endpoint.py
